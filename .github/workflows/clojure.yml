name: Clojure CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

# Cancel in-progress runs for the same branch when a new commit lands —
# saves runner minutes on rapid-iteration PRs without losing the final-
# commit signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege by default; raise per-job only if needed (e.g. release-
# publish workflows would request `contents: write`).
permissions:
  contents: read

env:
  # OpenJDK 25 (September 2025 LTS) per decision
  # `decisions/sandbar_ci_uses_openjdk_25_2026_05_15.md` (corpus).
  JDK_VERSION: '25'

jobs:
  test:
    name: Test (OpenJDK ${{ env.JDK_VERSION }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      # DeLaGuardo/setup-clojure is the canonical action for installing
      # Leiningen / clojure CLI / Babashka / clj-kondo on GitHub-hosted
      # runners; supports all the Clojure-tooling installers.
      - name: Set up Clojure tooling
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          lein: latest

      # Cache the local Maven repo so subsequent runs skip re-downloading
      # the dependency graph.  Key includes project.clj's hash so a deps
      # bump correctly invalidates; restore-keys provide partial reuse on
      # near-misses.
      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk${{ env.JDK_VERSION }}-maven-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-jdk${{ env.JDK_VERSION }}-maven-

      # Maven Central rate-limits aggregator runners under burst load and
      # returns HTTP 429.  Retry the deps resolution with exponential
      # backoff to absorb transient flakes; legitimate dep failures
      # (typo, missing artifact in every retry) still surface after the
      # cap.
      - name: Resolve dependencies (with retry on transient Maven flake)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if lein deps; then
              exit 0
            fi
            backoff=$((10 * attempt))
            echo "::warning::lein deps failed on attempt ${attempt}; retrying in ${backoff}s..."
            sleep "${backoff}"
          done
          echo "::error::lein deps failed after 3 attempts"
          exit 1

      - name: Run tests
        run: lein test
