name: Clojure CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

# Cancel in-progress runs for the same branch when a new commit lands —
# saves runner minutes on rapid-iteration PRs without losing the final-
# commit signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege by default; raise per-job only if needed (e.g. release-
# publish workflows would request `contents: write`).
permissions:
  contents: read

jobs:
  test:
    # OpenJDK 25 (September 2025 LTS) per decision
    # `decisions/sandbar_ci_uses_openjdk_25_2026_05_15.md` (corpus).
    name: Test (OpenJDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # DeLaGuardo/setup-clojure is the canonical action for installing
      # Leiningen / clojure CLI / Babashka / clj-kondo on GitHub-hosted
      # runners; supports all the Clojure-tooling installers.
      - name: Set up Clojure tooling
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          lein: latest

      # `config/config.edn` is .gitignore'd (per-developer database
      # URL / nREPL port).  The fixture machinery reads it via
      # `sandbar.util.edn/config-value :required-schema`; a missing
      # file surfaces as `Cannot open <nil> as a Reader` from every
      # DB-backed test's fixture setup.  CI bootstraps from the
      # committed `config-example.edn` template.
      - name: Bootstrap config.edn from example
        run: cp config/config-example.edn config/config.edn

      # Cache the local Maven repo so subsequent runs skip re-downloading
      # the dependency graph.  Key includes project.clj's hash so a deps
      # bump correctly invalidates; restore-keys provide partial reuse on
      # near-misses.
      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk25-maven-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-jdk25-maven-

      # Maven Central rate-limits aggregator runners under burst load and
      # returns HTTP 429.  Retry the deps resolution with exponential
      # backoff to absorb transient flakes; legitimate dep failures
      # (typo, missing artifact in every retry) still surface after the
      # cap.
      - name: Resolve dependencies (with retry on transient Maven flake)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if lein deps; then
              exit 0
            fi
            backoff=$((10 * attempt))
            echo "::warning::lein deps failed on attempt ${attempt}; retrying in ${backoff}s..."
            sleep "${backoff}"
          done
          echo "::error::lein deps failed after 3 attempts"
          exit 1

      - name: Run tests
        run: lein test

  # Catalog single-source drift gate (F6).  DB-free, so it runs as a SEPARATE
  # lightweight job that does not wait on the test matrix / Datomic fixtures —
  # a red `catalog-drift` check blocks the PR merge the instant a projection
  # (doc/mcp-affordance-map.md) drifts from the `verb-catalog` source, or a
  # consolidation rename flips a verb's leaf safety class (§5.8).  This is the
  # backstop for anyone who bypasses the local pre-commit hook (--no-verify,
  # web edits).  Sandbar-LOCAL scope only (option b); the corpus repo checks
  # its own two projections.
  catalog-check:
    name: Catalog single-source drift gate (DB-free)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure tooling
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          lein: latest

      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk25-maven-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-jdk25-maven-

      # The gate is DB-free — no config.edn bootstrap, no Datomic fixtures.
      - name: Catalog single-source drift gate
        run: lein catalog-check
